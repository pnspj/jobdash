services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: jobdash-dynamodb-local
    # -sharedDb: use a single DB file regardless of region/credentials
    # -dbPath: persist data to the mounted volume
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

volumes:
  dynamodb-data:
