<!doctype html>
<!-- Source of site/images/ogp.png (1200x630). Regenerate with scripts/site/render.sh -->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        color: #1f2328;
        background: linear-gradient(135deg, #f6f8fa 0%, #e8f1fc 100%);
      }
      .text {
        position: absolute;
        left: 72px;
        top: 96px;
        width: 560px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 34px;
        font-weight: 700;
      }
      .logo img {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 56px 0 28px;
        font-size: 64px;
        line-height: 1.3;
        letter-spacing: 0.01em;
      }
      h1 code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #2a78d6;
      }
      p {
        margin: 0;
        font-size: 26px;
        line-height: 1.6;
        color: #3d4752;
      }
      .shot {
        position: absolute;
        left: 680px;
        top: 148px;
        width: 860px;
        border: 1px solid #d8dee4;
        border-radius: 14px;
        box-shadow: 0 20px 48px rgb(0 0 0 / 0.16);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="logo"><img src="../../site/favicon.svg" alt="" />JobDash</div>
      <h1>転職活動を、<br /><code>localhost</code> で。</h1>
      <p>エンジニアのための、<br />オープンソースの転職活動ダッシュボード</p>
    </div>
    <img class="shot" src="../../site/images/dashboard.png" alt="" />
  </body>
</html>
